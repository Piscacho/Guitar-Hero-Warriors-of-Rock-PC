; Guitar Hero: Warriors of Rock (recompilado)
; iso: ruta al ISO del juego (Xbox 360). Si esta vacio, se pide al arrancar.
iso=
datos=userdata
dlc=dlc
; desenfoque_movimiento: 1 = como la consola, 0 = imagen mas nitida en movimiento
desenfoque_movimiento=1
; saltar_intro: 1 = sin el video de logos al arrancar, 0 = con el video
saltar_intro=1
; grano_pelicula: 1 = grano como la consola (aqui sale en rayas finas), 0 = sin grano
grano_pelicula=0
; ---- Launcher y graficos (los cambia la ventana del launcher) ----
; mostrar_launcher: 1 = abre la ventana de configuracion al iniciar, 0 = directo al juego (Mayus al abrir la vuelve a mostrar)
mostrar_launcher=1
pantalla_completa=0
ventana=1280x720
; escalado: catmull-rom (nitido) o bilineal (suave)
escalado=catmull-rom
vsync=1
; latencia_audio: baja (~40 ms, puede dar chasquidos en cargas), normal (~55 ms) o segura (~95 ms)
latencia_audio=normal
; ---- Mando (Xbox o PlayStation) como guitarra ----
; mando_modo: guitarra = el mando hace de guitarra (recomendado), mando = mando normal
; Botones: A B X Y LB RB LT RT BACK START UP DOWN LEFT RIGHT LS RS LS_UP LS_DOWN LS_LEFT LS_RIGHT RS_UP RS_DOWN RS_LEFT RS_RIGHT
;          (PlayStation: CRUZ CIRCULO CUADRADO TRIANGULO L1 R1 L2 R2 OPTIONS CREATE). Varios botones: A|LB
; Ejemplo con gatillos: mando_verde=LT, mando_rojo=LB, mando_amarillo=RB, mando_azul=RT, mando_naranja=A
mando_modo=guitarra
mando_verde=A
mando_rojo=B
mando_amarillo=Y
mando_azul=X
mando_naranja=LB
mando_rasgueo_arriba=UP|LS_UP
mando_rasgueo_abajo=DOWN|LS_DOWN
mando_izquierda=LEFT|LS_LEFT
mando_derecha=RIGHT|LS_RIGHT
mando_start=START
mando_poder_estrella=BACK|RB
; mando_palanca: control analogico para la palanca (whammy): RT, LT o RS
mando_palanca=RT
; ---- Bateria y voz ----
; mando_instrumento: guitarra, bateria o voz (F6 en el juego los recorre). Teclado en bateria: 1-5 pads, K o B = bombo
;   voz = el mando funciona como mando normal para los menus y se canta con el microfono de Windows
mando_instrumento=guitarra
bateria_verde=A
bateria_rojo=B
bateria_amarillo=Y
bateria_azul=X
bateria_naranja=RB
bateria_bombo=LB|LT|RT
bateria_arriba=UP|LS_UP
bateria_abajo=DOWN|LS_DOWN
bateria_start=START
bateria_back=BACK
; ---- Varios jugadores (hasta 4) ----
; Cada mando XInput es un jugador (mando 1 = jugador 1...). jugadorN_instrumento: guitarra, bateria o voz
;   (jugador 1: si falta jugador1_instrumento se usa mando_instrumento). El microfono va al primer jugador con voz.
; jugadorN_xinput: numero de mando XInput de ese jugador (0 = ninguno)
; teclado_jugador / mando_ps_jugador: jugador que manejan el teclado y el mando de PlayStation
; Los jugadores 2 a 4 juegan como invitados: en el aviso de perfil elige "Continue without saving".
jugador2_instrumento=guitarra
jugador3_instrumento=bateria
jugador4_instrumento=voz
; Botones propios de un jugador: jugadorN_<clave>, por ejemplo jugador2_mando_verde=LT (si falta, usa la comun)
teclado_jugador=1
mando_ps_jugador=1
; ---- Microfono ----
; microfono: 1 = el microfono predeterminado de Windows hace de microfono USB de la consola, 0 = sin microfono
microfono=1
; microfono_ganancia: multiplicador del volumen del microfono (1.0 = sin cambios)
; microfono_dispositivo: identificador del microfono (lo elige el launcher); vacio = el predeterminado de Windows
microfono_dispositivo=
microfono_ganancia=1.0